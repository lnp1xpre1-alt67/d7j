workflows:
  ios-workflow:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 15
    environment:
      xcode: latest
    scripts:
      - name: Build and Package IPA
        script: |
          PROJ_DIR=$(dirname $(find . -name "AzizCal.xcodeproj" -type d | head -n 1))
          echo "Found project in: $PROJ_DIR"
          cd "$PROJ_DIR"

          mkdir -p AzizCal.xcodeproj/xcshareddata/xcschemes
          cat > AzizCal.xcodeproj/xcshareddata/xcschemes/AzizCal.xcscheme << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1500" version="1.7">
            <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
              <BuildActionEntries>
                <BuildActionEntry buildForRunning="YES" buildForArchiving="YES">
                  <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="E10100012C00000000000001" BuildableName="AzizCal.app" BlueprintName="AzizCal" ReferencedContainer="container:AzizCal.xcodeproj"/>
                </BuildActionEntry>
              </BuildActionEntries>
            </BuildAction>
            <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
          </Scheme>
          EOF

          xcodebuild archive \
            -project AzizCal.xcodeproj \
            -scheme AzizCal \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/AzizCal.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload
          APP_DIR=$(find build -name "AzizCal.app" -type d | head -n 1)
          cp -R "$APP_DIR" Payload/

          if [ ! -f "Payload/AzizCal.app/Info.plist" ]; then
            cp AzizCal/Resources/Info.plist Payload/AzizCal.app/Info.plist
            sed -i '' 's/\$(EXECUTABLE_NAME)/AzizCal/g' Payload/AzizCal.app/Info.plist
            sed -i '' 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.aziz.azizcal/g' Payload/AzizCal.app/Info.plist
            sed -i '' 's/\$(PRODUCT_NAME)/AzizCal/g' Payload/AzizCal.app/Info.plist
          fi

          zip -r -y AzizCal.ipa Payload
          unzip -l AzizCal.ipa | grep "Info.plist"
    artifacts:
      - "**/AzizCal.ipa"
