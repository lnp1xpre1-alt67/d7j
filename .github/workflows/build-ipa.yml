name: Build iOS IPA (AzizCal)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate Project
        id: locate
        run: |
          PROJ_DIR=$(dirname $(find . -name "AzizCal.xcodeproj" | head -n 1))
          echo "Found project in: $PROJ_DIR"
          echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

      - name: Compile iOS App
        run: |
          cd "${{ steps.locate.outputs.proj_dir }}"
          xcodebuild build \
            -project AzizCal.xcodeproj \
            -target AzizCal \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          cd "${{ steps.locate.outputs.proj_dir }}"
          APP_PATH=$(find derived_data -name "AzizCal.app" | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y AzizCal.ipa Payload
          ls -lh AzizCal.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzizCal-iOS-IPA
          path: "**/AzizCal.ipa"
          if-no-files-found: error
