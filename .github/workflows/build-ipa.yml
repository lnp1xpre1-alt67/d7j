name: Build iOS IPA (AzizCal)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build Archive
        run: |
          if [ -d "azizcal_/AzizCal.xcodeproj" ]; then
            cd azizcal_
          fi
          xcodebuild archive \
            -project AzizCal.xcodeproj \
            -scheme AzizCal \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AzizCal.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          if [ -d "azizcal_/build" ]; then
            cd azizcal_
          fi
          mkdir -p build/Payload
          cp -R build/AzizCal.xcarchive/Products/Applications/AzizCal.app build/Payload/
          cd build
          zip -r -y AzizCal.ipa Payload
          ls -la AzizCal.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzizCal-iOS-IPA
          path: |
            build/AzizCal.ipa
            azizcal_/build/AzizCal.ipa
          if-no-files-found: error
